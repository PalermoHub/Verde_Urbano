name: LIPU · Genera schede PDF

on:
  push:
    branches: [main]
    paths:
      - 'Lipu/schede_pdf/**.json'
      - 'Lipu/scripts/genera_pdf.py'
  workflow_dispatch:

jobs:
  genera-pdf:
    runs-on: ubuntu-latest
    # Evita loop: il workflow committa solo .pdf, non .json, quindi non si riesegue
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa font Unicode
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Installa dipendenze
        run: pip install fpdf2 Pillow

      - name: Genera PDF mancanti
        run: python Lipu/scripts/genera_pdf.py

      - name: Commit PDF generati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Lipu/schede_pdf/
          if git diff --staged --quiet; then
            echo "Nessun nuovo PDF da generare"
          else
            git commit -m "[pdf] genera schede ispezione LIPU"
            git push
          fi
