name: LIPU · Ridimensiona foto ispezioni

on:
  push:
    branches: [main]
    paths: ['Lipu/foto/**']

jobs:
  resize:
    runs-on: ubuntu-latest
    # Evita loop infinito: non rieseguire sui commit del bot
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installa ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Ridimensiona immagini (max 1024px, qualità 85%)
        run: |
          find Lipu/foto -name '*.jpg' -o -name '*.jpeg' -o -name '*.JPG' -o -name '*.JPEG' | while read f; do
            W=$(identify -format "%w" "$f" 2>/dev/null || echo 0)
            H=$(identify -format "%h" "$f" 2>/dev/null || echo 0)
            if [ "$W" -gt 1024 ] || [ "$H" -gt 1024 ]; then
              mogrify -resize '1024x1024>' -quality 85 "$f"
              echo "Ridimensionata: $f (${W}x${H})"
            else
              echo "OK già piccola: $f (${W}x${H})"
            fi
          done

      - name: Commit foto ridimensionate
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Lipu/foto/
          if git diff --staged --quiet; then
            echo "Nessuna modifica — tutte le foto erano già sotto 1200px"
          else
            git commit -m "[resize] ottimizza foto ispezioni LIPU"
            git push
          fi
